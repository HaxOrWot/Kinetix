<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="100%" height="100%" fill="#111116" />
  <rect x="20" y="20" width="360" height="160" fill="#1e1e2e">
    <animate attributeName="opacity" from="0.7" to="1.0" dur="3s" repeatCount="indefinite" />
  </rect>
  <circle cx="200" cy="100" r="40" fill="#00e5ff">
    <animate attributeName="r" from="20" to="50" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="110" y="105" fill="#ffffff" font-size="24px" font-family="sans-serif">
    KINETIX ENGINE
    <animate attributeName="fill" from="#00e5ff" to="#ff007f" dur="2s" repeatCount="indefinite" />
  </text>
</svg>
